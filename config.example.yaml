# Vault server settings. Sources (exchanges, wallets) are added in the web UI and stored
# in data/sources.yaml — they don't go here.

refreshMinutes: 5        # balances and prices
staleMaxHours: 24        # show last-good data (badged "stale") for up to this long when an API fails
activityMinutes: 15      # activity sync cadence
showTokenLogos: false    # true = show Jupiter logos for SPL tokens instead of ticker monograms

bitcoin:
  esploraUrl: https://mempool.space/api   # point at your own mempool/electrs node for privacy
  gapLimit: 20

solana:
  # The public RPC is rate-limited and rejects stake-account lookups.
  # A free Helius URL is recommended: https://mainnet.helius-rpc.com/?api-key=YOUR_KEY
  rpcUrl: https://api.mainnet-beta.solana.com
  includeStakeAccounts: true
  hideUnpriced: true     # collapse unverified, unpriced and dust tokens into "N hidden tokens"
  minUsd: 1
  hideMints: []
  allowMints: []         # unverified tokens you really hold: always shown and counted
  tokenOverrides: {}     # { <mint>: { symbol: XYZ, name: "Some token" } }
  defi: [jupiter, orca, raydium]

ntfy:
  url: ""                # e.g. https://ntfy.sh/your-long-random-topic (alerts milestone)
  redactAmounts: true

activity:
  backfillDays: 365

# Optional: sources to create on first run only (unattended setup). Secrets placed here
# are sealed into data/sources.yaml on import; remove them from this file afterwards.
# seedSources:
#   - { id: cold, type: bitcoin, label: "Cold storage", kind: hardware, key: "zpub6r..." }
