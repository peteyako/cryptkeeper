<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vault — Portfolio mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: {{t.bg}}; color: {{t.t1}}; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column">

  <div style="flex: 1; min-height: 0; overflow: hidden; padding: 20px 16px 0; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <button type="button" style="height: 44px; padding: 0 4px; border: 0; background: transparent; color: {{t.t1}}; font-family: inherit; font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 6px">
        Long-term
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
      </button>
      <div style="display: flex; gap: 8px">
        <button type="button" onClick="{{toggleHide}}" aria-pressed="{{hidden}}" aria-label="Hide balances" style="width: 44px; height: 44px; border: 1px solid {{t.bd2}}; border-radius: 10px; background: {{hideBg}}; color: {{t.t1}}; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        </button>
        <button type="button" aria-label="Refresh balances" style="width: 44px; height: 44px; border: 1px solid {{t.bd2}}; border-radius: 10px; background: {{t.s2}}; color: {{t.t1}}; display: flex; align-items: center; justify-content: center">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"></path><path d="M21 3v5h-5"></path></svg>
        </button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 13px; color: {{t.t2}}">Total value</span>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 36px; font-weight: 500; letter-spacing: -0.02em">{{total}}</span>
      <div style="display: flex; gap: 10px; align-items: center">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: {{t.gain}}">▲ {{change}}</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: {{t.gain}}">+2.56%</span>
        <span style="font-size: 12px; color: {{t.t3}}">past week</span>
      </div>
    </div>

    <svg viewBox="0 0 360 96" preserveAspectRatio="none" role="img" aria-label="Portfolio value, past week" style="width: 100%; height: 96px; display: block">
      <path d="M0 70 L33 62 L65 78 L98 72 L131 52 L164 58 L196 40 L229 48 L262 24 L295 34 L327 18 L360 26 L360 96 L0 96 Z" fill="{{t.acc}}" fill-opacity="0.08"></path>
      <path d="M0 70 L33 62 L65 78 L98 72 L131 52 L164 58 L196 40 L229 48 L262 24 L295 34 L327 18 L360 26" fill="none" stroke="{{t.acc}}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"></path>
    </svg>

    <div role="group" aria-label="Chart range" style="display: flex; padding: 4px; background: {{t.s1}}; border: 1px solid {{t.bd}}; border-radius: 10px; gap: 2px">
      <sc-for list="{{ranges}}" as="r" hint-placeholder-count="5">
        <button type="button" onClick="{{r.pick}}" aria-pressed="{{r.on}}" style="flex: 1; height: 36px; border: 0; border-radius: 7px; background: {{r.bg}}; color: {{r.fg}}; box-shadow: {{r.ring}}; font-size: 13px; font-family: 'IBM Plex Mono', monospace; cursor: pointer">{{r.key}}</button>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <h2 style="margin: 0; font-size: 15px; font-weight: 600">Sources</h2>
        <a href="MobileConnect.dc.html" style="font-size: 13px; color: {{t.link}}; text-decoration: none">+ Add</a>
      </div>
      <div style="display: flex; gap: 10px; overflow: hidden">
        <sc-for list="{{sources}}" as="s" hint-placeholder-count="3">
          <div style="flex: 0 0 150px; display: flex; background: {{t.s1}}; border: 1px solid {{t.bd}}; border-radius: 12px; overflow: hidden">
            <span style="width: 3px; flex-shrink: 0; background: {{s.rail}}"></span>
            <span style="flex: 1; display: flex; flex-direction: column; gap: 6px; padding: 12px">
              <span style="display: flex; justify-content: space-between; align-items: center; gap: 6px">
                <span style="font-size: 13px; font-weight: 600">{{s.name}}</span>
                <span style="width: 8px; height: 8px; border-radius: 50%; background: {{s.dot}}" aria-label="{{s.statusLabel}}" role="img"></span>
              </span>
              <span style="font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500">{{s.value}}</span>
              <span style="font-size: 11px; color: {{t.t3}}">{{s.kind}}</span>
            </span>
          </div>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px">
      <h2 style="margin: 0 0 4px; font-size: 15px; font-weight: 600">Holdings</h2>
      <sc-for list="{{holdings}}" as="h" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid {{t.bd}}">
          <span style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 50%; background: {{h.discBg}}; color: {{h.discFg}}; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; font-family: 'IBM Plex Mono', monospace">{{h.ticker}}</span>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 14px; font-weight: 500">{{h.name}}</span>
            <span style="font-size: 12px; color: {{t.t3}}; font-family: 'IBM Plex Mono', monospace">{{h.amount}}</span>
          </div>
          <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px">
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 500">{{h.value}}</span>
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: {{h.chgColor}}">{{h.chg}}</span>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <nav aria-label="Main" style="flex-shrink: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 6px 8px 22px; background: {{t.s1}}; border-top: 1px solid {{t.bd}}">
    <a href="#" style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 500; color: {{t.acc}}; text-decoration: none">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12 12 4l9 8"></path><path d="M5 10v10h14V10"></path></svg>Overview</a>
    <a href="#" style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 500; color: {{t.t2}}; text-decoration: none">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="3"></rect><path d="M16 13h.01"></path></svg>Wallets</a>
    <a href="#" style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 500; color: {{t.t2}}; text-decoration: none">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h13l-3-3M17 17H4l3 3"></path></svg>Activity</a>
    <a href="#" style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 500; color: {{t.t2}}; text-decoration: none">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>Settings</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { hidden: false, range: '1W' };
  }
  renderVals() {
    const themes = {
      dark: { bg: '#0D0F12', s1: '#14171C', s2: '#1B1F26', bd: '#262B33', bd2: '#343A44', t1: '#ECEEF1', t2: '#A3AAB5', t3: '#7C8592', acc: '#6E9BFF', accSoft: '#1E2A44', link: '#8FB2FF', gain: '#4FD69C', loss: '#FF8A7A', warn: '#F2B84B', exch: '#6E9BFF', hot: '#C08CFF', hw: '#F2B84B', btcBg: '#2E2410', btcFg: '#F2B84B', ethBg: '#1E2A44', ethFg: '#8FB2FF', solBg: '#271B3A', solFg: '#C08CFF', usdBg: '#12291F', usdFg: '#4FD69C' },
      light: { bg: '#F6F7F9', s1: '#FFFFFF', s2: '#F0F2F5', bd: '#E1E4E9', bd2: '#CDD2D9', t1: '#12151A', t2: '#4A525E', t3: '#69717D', acc: '#2F5FD9', accSoft: '#E6EDFC', link: '#2F5FD9', gain: '#0E7A4E', loss: '#C23B2B', warn: '#9A6400', exch: '#2F5FD9', hot: '#7A3FD1', hw: '#C48A12', btcBg: '#FBF0D9', btcFg: '#8A5A00', ethBg: '#E6EDFC', ethFg: '#2F5FD9', solBg: '#F0E8FB', solFg: '#6A32C0', usdBg: '#E3F4EC', usdFg: '#0E7A4E' }
    };
    const t = themes[this.props.theme ?? 'dark'] || themes.dark;
    const hidden = this.state.hidden;
    const usd = (v) => hidden ? '$ ••••••' : '$' + v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const chg = (c) => c > 0 ? '▲ +' + c.toFixed(2) + '%' : '▼ −' + Math.abs(c).toFixed(2) + '%';
    return {
      t,
      hidden,
      hideBg: hidden ? t.accSoft : t.s2,
      toggleHide: () => this.setState({ hidden: !hidden }),
      total: usd(48210.37),
      change: hidden ? '$ ••••' : '+$1,204.18',
      ranges: ['1D', '1W', '1M', '1Y', 'All'].map((k) => {
        const on = k === this.state.range;
        return { key: k, on, bg: on ? t.s2 : 'transparent', fg: on ? t.t1 : t.t2, ring: on ? 'inset 0 0 0 1px ' + t.bd2 : 'none', pick: () => this.setState({ range: k }) };
      }),
      sources: [
        { name: 'Ledger', kind: 'Hardware', rail: t.hw, value: usd(19240), dot: t.gain, statusLabel: 'Synced' },
        { name: 'Coinbase', kind: 'Exchange', rail: t.exch, value: usd(12810.42), dot: t.gain, statusLabel: 'Synced' },
        { name: 'Kraken', kind: 'Exchange', rail: t.exch, value: usd(9472.11), dot: t.warn, statusLabel: 'Stale' }
      ],
      holdings: [
        { ticker: 'BTC', name: 'Bitcoin', amount: hidden ? '•••• BTC' : '0.42108 BTC', value: usd(26999.65), chg: chg(2.14), chgColor: t.gain, discBg: t.btcBg, discFg: t.btcFg },
        { ticker: 'ETH', name: 'Ethereum', amount: hidden ? '•••• ETH' : '3.2500 ETH', value: usd(10336.30), chg: chg(-0.86), chgColor: t.loss, discBg: t.ethBg, discFg: t.ethFg },
        { ticker: 'SOL', name: 'Solana', amount: hidden ? '•••• SOL' : '39.0410 SOL', value: usd(5786.66), chg: chg(4.92), chgColor: t.gain, discBg: t.solBg, discFg: t.solFg },
        { ticker: 'USDC', name: 'USD Coin', amount: hidden ? '•••• USDC' : '3,374.80 USDC', value: usd(3374.80), chg: '– 0.00%', chgColor: t.t3, discBg: t.usdBg, discFg: t.usdFg }
      ]
    };
  }
}
</script>
</body>
</html>
