services:
  cryptkeeper:
    build: .
    image: cryptkeeper
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      TZ: ${TZ:-UTC}   # dates and times in the UI use this zone, e.g. America/Los_Angeles
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./.env:/app/.env:ro
      - ./data:/app/data
    # Declared here too: Podman's default (OCI) image format ignores Dockerfile HEALTHCHECK.
    healthcheck:
      test: ["CMD", "/app/crypto-portfolio", "healthcheck"]
      interval: 60s
      timeout: 5s
      start_period: 60s
      retries: 3
